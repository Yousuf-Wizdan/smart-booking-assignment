spring.application.name=smart-booking-engine

# --- Datasource (override via environment variables; see README) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_booking}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# --- Application configuration ---
# All business times (shift windows, cutoffs, night hours) are interpreted in this zone.
app.company-time-zone=${APP_COMPANY_TIME_ZONE:Asia/Kolkata}

# --- Security ---
# JWT signing secret. If blank, a random per-boot secret is generated (dev only:
# tokens do not survive a restart). Set a strong >= 32 byte value in production.
app.security.jwt-secret=${BOOKING_JWT_SECRET:}
app.security.jwt-expiry=${BOOKING_JWT_EXPIRY_MINUTES:480}
